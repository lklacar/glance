name: macOS build and checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Regression checks
        run: Scripts/check.sh
      - name: Universal release build
        run: Scripts/build.sh
      - name: Verify bundle
        run: Scripts/verify-bundle.sh
      - name: Package local build
        run: ditto -c -k --keepParent "dist/Glance.app" dist/Glance-macOS-local.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Glance-macOS-local
          path: dist/Glance-macOS-local.zip
